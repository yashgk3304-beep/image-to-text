<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to Text</title>
<script>
  // If this file is opened directly from disk, jump to the local server instead.
  if (location.protocol === "file:") location.replace("http://localhost:3000");
</script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#76b900; --border:#e2e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#eceef2; --muted:#9aa1ad; --border:#2b2f37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  #drop { border:2px dashed var(--border); border-radius:10px; padding:28px; text-align:center; cursor:pointer; color:var(--muted); }
  #drop.over { border-color:var(--accent); }
  #preview { max-width:100%; max-height:320px; border-radius:8px; display:none; margin:0 auto; }
  input[type=text] { width:100%; padding:10px 12px; margin-top:14px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#111; font-weight:600; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #out { margin-top:16px; white-space:pre-wrap; line-height:1.55; }
  .err { color:#d33; }
</style>
</head>
<body>
<main>
  <h1>Image → Text</h1>
  <p class="sub">Upload an image and get a description from an NVIDIA vision model.</p>

  <div class="card">
    <div id="drop">Click or drop an image here
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <img id="preview" alt="Preview">
    <input id="prompt" type="text" value="Describe this image in detail.">
    <button id="go" disabled>Generate text</button>
    <div id="out"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let imageData = null;

$("drop").onclick = () => $("file").click();
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); load(e.dataTransfer.files[0]); };
$("file").onchange = (e) => load(e.target.files[0]);

// NVIDIA's inline image limit is small (~180 KB), so shrink before sending.
function load(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const img = new Image();
  img.onload = () => {
    let max = 768, quality = 0.85, url;
    do {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      url = c.toDataURL("image/jpeg", quality);
      max *= 0.85; quality *= 0.95;
    } while (url.length > 170000 && max > 128);
    imageData = url;
    $("preview").src = url;
    $("preview").style.display = "block";
    $("drop").style.display = "none";
    $("go").disabled = false;
    $("out").textContent = "";
  };
  img.src = URL.createObjectURL(file);
}

$("go").onclick = async () => {
  $("go").disabled = true;
  $("out").className = "";
  $("out").textContent = "Thinking...";
  try {
    const r = await fetch("/api/describe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData, prompt: $("prompt").value })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(typeof data.error === "string" ? data.error : JSON.stringify(data.error));
    $("out").textContent = data.text;
  } catch (e) {
    $("out").className = "err";
    $("out").textContent = "Error: " + e.message;
  }
  $("go").disabled = false;
};
</script>
</body>
</html>
